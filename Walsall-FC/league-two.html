<script>
const clubs = [
  {club:'Notts County', code:'NOT', cap:20229, avg:10423},
  {club:'MK Dons', code:'MKD', cap:30500, avg:8563},
  {club:'Swindon Town', code:'SWI', cap:15728, avg:8434},
  {club:'Chesterfield', code:'CHE', cap:10504, avg:8143},
  {club:'Bristol Rovers', code:'BRR', cap:12000, avg:8051},
  {club:'Oldham Athletic', code:'OLD', cap:13513, avg:7538},
  {club:'Tranmere Rovers', code:'TRA', cap:16789, avg:6871},
  {club:'Cambridge United', code:'CAM', cap:8127, avg:6600},
  {club:'Grimsby Town', code:'GRI', cap:9546, avg:6537, la:'top'},
  {club:'Walsall', code:'WAL', cap:11300, avg:6356, la:'top'},
  {club:'Gillingham', code:'GIL', cap:11582, avg:6083, la:'bottom'},
  {club:'Crewe Alexandra', code:'CRE', cap:10153, avg:5693, la:'right'},
  {club:'Shrewsbury Town', code:'SHR', cap:9875, avg:5659, la:'left'},
  {club:'Colchester United', code:'COL', cap:10105, avg:5104, la:'bottom'},
  {club:'Newport County', code:'NEW', cap:7850, avg:4317},
  {club:'Cheltenham Town', code:'CHL', cap:7066, avg:3988, la:'bottom'},
  {club:'Bromley', code:'BRO', cap:6100, avg:3953, la:'top'},
  {club:'Crawley Town', code:'CRA', cap:6134, avg:3631, la:'right'},
  {club:'Harrogate Town', code:'HAR', cap:5000, avg:3054, la:'top'},
  {club:'Salford City', code:'SAL', cap:5108, avg:3045, la:'left'},
  {club:'Barnet', code:'BNT', cap:5176, avg:2848, la:'left'},
  {club:'Fleetwood Town', code:'FLE', cap:5327, avg:2818, la:'right'},
  {club:'Barrow', code:'BRW', cap:6500, avg:2809},
  {club:'Accrington Stanley', code:'ACC', cap:5450, avg:2259}
];
clubs.forEach(c => c.st = +(c.avg / c.cap * 100).toFixed(1));

const others = clubs.filter(c => c.club !== 'Walsall').map(c => ({x:c.cap, y:c.st, club:c.club, code:c.code, avg:c.avg, la:c.la||'top'}));
const walsall = clubs.filter(c => c.club === 'Walsall').map(c => ({x:c.cap, y:c.st, club:c.club, code:c.code, avg:c.avg, la:c.la||'top'}));

new Chart(document.getElementById('scatter').getContext('2d'), {
  type: 'scatter',
  data: {
    datasets: [
      { label:'League Two clubs', data:others, backgroundColor:'rgba(7,56,94,0.78)', pointRadius:6, pointHoverRadius:8 },
      { label:'Walsall FC', data:walsall, backgroundColor:'#D5C393', borderColor:'#07385E', borderWidth:2.5, pointRadius:9, pointHoverRadius:11 }
    ]
  },
  options: {
    responsive:true, maintainAspectRatio:false,
    plugins: {
      legend: {
        labels: { font:{family:'Montserrat',size:12,weight:'600'}, color:'#07385E', usePointStyle:true, pointStyle:'circle' }
      },
      tooltip: {
        backgroundColor:'#07385E', titleColor:'#D5C393', bodyColor:'#fff',
        titleFont:{family:'Montserrat',weight:'700',size:13}, bodyFont:{family:'Montserrat',size:12},
        padding:12, displayColors:false,
        callbacks: {
          title: items => items[0].raw.club,
          label: item => {
            const d = item.raw;
            const mis = (d.y/100)*(d.y/100)*100 + d.avg/1000;
            return [
              'Capacity: ' + d.x.toLocaleString(),
              'Avg attendance: ' + d.avg.toLocaleString(),
              'Sell-through: ' + d.y.toFixed(1) + '%',
              'MIS: ' + mis.toFixed(1)
            ];
          }
        }
      },
      datalabels: {
        align: ctx => ctx.dataset.data[ctx.dataIndex].la,
        anchor:'center', offset:7, clamp:true,
        font: ctx => ({family:'Montserrat', size:10, weight: ctx.dataset.label === 'Walsall FC' ? '800' : '600'}),
        color: ctx => ctx.dataset.label === 'Walsall FC' ? '#07385E' : '#4A7396',
        formatter: v => v.code
      }
    },
    scales: {
      x: {
        min:0, max:32000,
        title:{display:true, text:'Stadium capacity', font:{family:'Montserrat',size:12,weight:'600'}, color:'#07385E'},
        ticks:{font:{family:'Montserrat',size:11}, color:'#4A7396', callback:v=>v.toLocaleString()},
        grid:{color:'rgba(7,56,94,0.06)'}
      },
      y: {
        min:20, max:90,
        title:{display:true, text:'Sell-through (%)', font:{family:'Montserrat',size:12,weight:'600'}, color:'#07385E'},
        ticks:{font:{family:'Montserrat',size:11}, color:'#4A7396', callback:v=>v+'%'},
        grid:{color:'rgba(7,56,94,0.06)'}
      }
    }
  },
  plugins:[ChartDataLabels]
});
</script>
