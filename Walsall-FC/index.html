let capacity = 11300;
const trendVisible = [false, false, false];

function linearTrend(values) {
  const n = values.length;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  values.forEach((y, i) => { sx += i; sy += y; sxy += i * y; sxx += i * i; });
  const slope = (n * sxy - sx * sy) / (n * sxx - sx * sx);
  const intercept = (sy - slope * sx) / n;
  return values.map((_, i) => Math.round(intercept + slope * i));
}

const maxLen = Math.max(...seasons.map(s => s.matches.length));
const labels = Array.from({length: maxLen}, (_, i) => 'Match ' + (i + 1));

function buildDatasets() {
  const ds = [];
  seasons.forEach((s, idx) => {
    ds.push({
      label: s.name,
      data: s.matches.map(m => m.att),
      borderColor: s.color,
      backgroundColor: s.color,
      borderWidth: 2.5,
      pointRadius: 4,
      pointHoverRadius: 6,
      tension: 0.25,
      seasonIndex: idx,
      isTrend: false
    });
  });
  seasons.forEach((s, idx) => {
    ds.push({
      label: s.name + ' trend',
      data: linearTrend(s.matches.map(m => m.att)),
      borderColor: s.color,
      borderWidth: 1.5,
      borderDash: [6, 5],
      pointRadius: 0,
      pointHoverRadius: 0,
      hidden: !trendVisible[idx],
      seasonIndex: idx,
      isTrend: true
    });
  });
  ds.push({
    label: 'Capacity',
    data: Array(maxLen).fill(capacity),
    borderColor: '#D5C393',
    borderWidth: 2,
    borderDash: [10, 6],
    pointRadius: 0,
    pointHoverRadius: 0,
    isCapacity: true
  });
  return ds;
}

    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'nearest', intersect: true },
    plugins: {

          color: '#07385E',
          usePointStyle: true,
          pointStyleWidth: 34,
          filter: item => !item.text.includes('trend'),
          generateLabels: chart => {
            const labels = Chart.defaults.plugins.legend.labels.generateLabels(chart);
            labels.forEach(l => {
              const ds = chart.data.datasets[l.datasetIndex];
              l.pointStyle = 'line';
              l.lineWidth = ds.borderWidth;
              l.lineDash = ds.borderDash || [];
            });
            return labels;
          }
        }
      },
      tooltip: {
        backgroundColor: '#07385E',
        titleColor: '#D5C393',
        bodyColor: '#FFFFFF',
        titleFont: { family: 'Montserrat', weight: '700', size: 13 },
        bodyFont: { family: 'Montserrat', size: 12 },
        padding: 12,
        displayColors: false,
        filter: item => !item.dataset.isTrend && !item.dataset.isCapacity,
        callbacks: {
          title: items => {
            const d = items[0].dataset;
            if (d.isTrend || d.isCapacity) return '';
            const m = seasons[d.seasonIndex].matches[items[0].dataIndex];
            return 'vs ' + m.opp + ' (' + m.pos + ')';
          },
          label: item => {
            const d = item.dataset;

            return [
              m.day + ' ' + m.date + '  •  ' + d.label.replace(' trend',''),
              'Result: ' + m.res,
              'Attendance: ' + m.att.toLocaleString(),
              'Capacity: ' + pct + '%'
            ];
          }
        }
      }
    },
    scales: {
      y: {
        min: 0,
        suggestedMax: 12000,
        ticks: {
          font: { family: 'Montserrat', size: 11 },
          color: '#4A7396',
          callback: v => v.toLocaleString()
        },
        grid: { color: 'rgba(7, 56, 94, 0.07)' },
        title: {
          display: true,
          text: 'Attendance',
          font: { family: 'Montserrat', size: 12, weight: '600' },
          color: '#07385E'
        }
      },
      x: {
        ticks: { font: { family: 'Montserrat', size: 11 }, color: '#4A7396' },
        grid: { display: false },
        title: {
          display: true,
          text: 'Home match (chronological)',
          font: { family: 'Montserrat', size: 12, weight: '600' },
          color: '#07385E'
        }
      }
    }
  }
});

function toggleTrend(idx) {
  trendVisible[idx] = !trendVisible[idx];
  document.getElementById('trend-' + idx).classList.toggle('active', trendVisible[idx]);
  chart.data.datasets.forEach(d => {
    if (d.isTrend && d.seasonIndex === idx) d.hidden = !trendVisible[idx];
  });
  chart.update();
}

document.getElementById('capInput').addEventListener('change', e => {
  const v = parseInt(e.target.value, 10);
  if (!isNaN(v) && v > 0) {
    capacity = v;
    chart.data.datasets.forEach(d => {
      if (d.isCapacity) d.data = Array(maxLen).fill(capacity);
    });
    chart.update();
    buildStats();
  }
});

function buildStats() {
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = '';
  seasons.forEach(s => {
    const atts = s.matches.map(m => m.att);
    const total = atts.reduce((a, b) => a + b, 0);
    const avg = Math.round(total / atts.length);
    const hi = Math.max(...atts);
    const lo = Math.min(...atts);
    const hiM = s.matches.find(m => m.att === hi);
    const loM = s.matches.find(m => m.att === lo);
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.style.borderTopColor = s.color;
    card.innerHTML =
      '<h3 style="color:' + (s.color === '#A9C3D6' ? '#4A7396' : s.color) + '">' + s.name + '</h3>' +
      '<div class="row"><span class="label">Average</span><span class="value">' + avg.toLocaleString() + ' (' + ((avg/capacity)*100).toFixed(1) + '%)</span></div>' +
      '<div class="row"><span class="label">Total</span><span class="value">' + total.toLocaleString() + '</span></div>' +
      '<div class="row"><span class="label">Highest</span><span class="value">' + hi.toLocaleString() + ' — ' + hiM.opp + '</span></div>' +
      '<div class="row"><span class="label">Lowest</span><span class="value">' + lo.toLocaleString() + ' — ' + loM.opp + '</span></div>' +
      '<div class="row"><span class="label">Matches</span><span class="value">' + atts.length + '</span></div>';
    grid.appendChild(card);
  });
}
buildStats();
</script>
</body>
</html>
